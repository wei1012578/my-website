<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 响应式关键：手机上看时页面宽度 = 屏幕宽度 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魏同学 · 我的个人网站</title>

  <!-- 浏览器标签页小图标：深蓝圆 + 金色 F（芙宁娜） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231a2d5a'/%3E%3Ctext x='16' y='22' font-size='16' fill='%23d4af37' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">

  <style>
    /* ============ 1. 颜色变量（芙宁娜主题：水蓝 / 深蓝 / 金） ============
       想换色只改这里，全站一起变 */
    :root {
      --dark-blue: #1a2d5a;   /* 主色：深蓝 */
      --water-blue: #e6f5ff;  /* 水蓝（标题用，清透感） */
      --gold: #d4af37;        /* 金色（王冠 / 高亮） */
      --nav-bg: rgba(13, 27, 64, 0.8);   /* 导航半透明深蓝 */
      --mask: rgba(0, 0, 0, 0.4);        /* 背景遮罩，让文字清楚 */
      --text: #cccccc;        /* 正文浅灰 */
    }

    /* ============ 2. 基础重置 ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ============ 3. 背景：芙宁娜立绘铺满全屏，不随滚动 ============
       background-attachment: fixed 让背景固定不动，
       内容滚动时背景像"舞台幕布"一样钉在屏幕上 */
    body {
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-image: url('bg.jpg');   /* 背景图：芙宁娜在右侧，左侧留白放内容 */
      background-size: cover;            /* 铺满整个屏幕，超出部分自动裁掉 */
      background-position: center;       /* 居中 */
      background-attachment: fixed;      /* 固定不随滚动 */
      color: var(--text);
      line-height: 1.7;
    }

    /* 背景遮罩层：盖在背景图上、内容底下，防止文字看不清 */
    .overlay {
      position: fixed;                   /* 铺满全屏、不滚动 */
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--mask);           /* 半透明黑色 */
      z-index: 0;                        /* 在内容（z-index 1）下面 */
      pointer-events: none;              /* 不挡鼠标点击 */
    }

    /* 所有内容放在遮罩上面一层 */
    main {
      position: relative;
      z-index: 1;
    }

    /* ============ 4. 顶部导航：半透明深蓝 + 白字 + 悬停金线 ============ */
    nav {
      position: sticky;
      top: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(8px);        /* 导航本身也带一点毛玻璃，更高级 */
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-around;
      padding: 14px 10px;
      z-index: 10;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      padding: 4px 10px;
      transition: color 0.2s;
    }

    /* 鼠标悬停：文字变金色 + 底部出现金色下划线 */
    nav a:hover {
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
    }

    /* 当前所在页：直接显示金色下划线 */
    nav a.active {
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
    }

    /* ============ 5. 页面区块（JS 控制显示/隐藏） ============ */
    .page {
      display: none;
      padding: 48px 20px;
      min-height: 70vh;
    }
    .page.active {
      display: block;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ============ 6. 首页：头像 + 名字 + 简介（居中） ============ */
    .hero {
      text-align: center;
      padding: 70px 0 40px;
    }

    /* 圆形头像：先用深蓝底 + 金色"魏"字代替照片。
       有照片后：把下面 div 换成 <img class="avatar" src="avatar.jpg" alt="我的头像"> */
    .avatar-placeholder {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(26, 45, 90, 0.9);   /* 深蓝圆底 */
      color: var(--gold);                   /* 金色字 */
      font-size: 48px;
      font-weight: bold;
      display: flex;                        /* 居中 */
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold);        /* 金色描边，像芙宁娜的皇冠 */
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25); /* 淡淡的金色光晕 */
    }

    .hero h1 {
      font-size: 34px;
      color: var(--water-blue);   /* 水蓝色标题 */
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);  /* 深色阴影，背景上更清楚 */
    }

    .hero p {
      font-size: 17px;
      color: var(--text);
    }

    /* ============ 7. 小标题 ============ */
    .section-title {
      font-size: 26px;
      color: var(--water-blue);
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--gold);   /* 金色下划线 */
      display: inline-block;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* ============ 8. 关于我 ============ */
    .about-list {
      list-style: none;
      margin-top: 20px;
    }
    .about-list li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);  /* 半透明分隔线 */
      color: var(--text);
    }
    .about-list b {
      color: var(--gold);
      margin-right: 12px;
    }

    /* ============ 9. 作品卡片：磨砂玻璃效果 ============
       backdrop-filter: blur(10px) 让卡片背后的背景模糊，
       background 半透明白做出"磨砂玻璃"质感 */
    .card {
      background: rgba(255, 255, 255, 0.1);    /* 半透明白 */
      backdrop-filter: blur(10px);             /* 背后模糊 = 磨砂 */
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4); /* 细金边 */
      border-radius: 16px;
      padding: 22px;
      margin-top: 20px;
    }
    .card h3 {
      color: var(--water-blue);
      margin-bottom: 8px;
    }
    .card p {
      font-size: 14px;
      color: var(--text);
    }
    .card img {
      width: 100%;
      border-radius: 12px;
      display: block;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.06);   /* 图是透明底，垫一层底色更协调 */
    }

    /* ============ 10. 联系 ============ */
    .contact-links {
      margin-top: 20px;
      font-size: 16px;
    }
    .contact-links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      padding: 6px 0;
    }
    .contact-links a:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* ============ 11. 页脚 ============ */
    footer {
      background: rgba(13, 27, 64, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #9fb0cc;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    /* ============ 12. 响应式：电脑端增强（先手机后电脑） ============ */
    @media (min-width: 768px) {
      .hero {
        padding: 100px 0 60px;
      }
      .hero h1 {
        font-size: 42px;
      }
      .page {
        padding: 60px 24px;
      }
      .card p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- 背景遮罩层：让背景上的文字清楚 -->
  <div class="overlay"></div>

  <!-- 顶部导航：href 让地址栏带锚点，onclick 直接切页（详见底部 JS） -->
  <nav>
    <a href="#home" class="active" onclick="showPage('home')">首页</a>
    <a href="#about" onclick="showPage('about')">关于我</a>
    <a href="#works" onclick="showPage('works')">作品</a>
    <a href="#contact" onclick="showPage('contact')">联系</a>
  </nav>

  <main>
    <!-- 首页：头像 + 名字 + 一句话介绍 -->
    <section id="page-home" class="page active">
      <div class="container hero">
        <div class="avatar-placeholder">魏</div>
        <!-- ↑ 有照片后换成：<img class="avatar" src="avatar.jpg" alt="我的头像"> -->
        <h1>魏同学</h1>
        <p>一名热爱学习的学生，正在用代码做有趣的东西</p>
      </div>
    </section>

    <!-- 关于我 -->
    <section id="page-about" class="page">
      <div class="container">
        <h2 class="section-title">关于我</h2>
        <ul class="about-list">
          <li><b>专业</b>物联网工程</li>
          <li><b>学校</b>信阳（待补充）</li>
          <li><b>兴趣</b>编程、桌宠开发、看歌剧</li>
        </ul>
      </div>
    </section>

    <!-- 作品 -->
    <section id="page-works" class="page">
      <div class="container">
        <h2 class="section-title">作品</h2>
        <div class="card">
          <img src="pet.png" alt="芙宁娜桌宠截图">
          <!-- ↑ 桌宠图：想换图就把同名图片覆盖 pet.png，或改这里的文件名 -->
          <h3>芙宁娜桌宠</h3>
          <p>用 Python + PowerShell 做的桌面宠物：会走路、会聊天、有课程表提醒，
             还内置了芙宁娜人设和好感度系统。是我从零做的最大的一个项目。</p>
        </div>
        <!-- 以后有新作品：复制上面 <div class="card"> 整块，粘贴一份改文字即可 -->
      </div>
    </section>

    <!-- 联系 -->
    <section id="page-contact" class="page">
      <div class="container">
        <h2 class="section-title">联系我</h2>
        <div class="contact-links">
          <p><a href="mailto:你的邮箱@example.com">邮箱：你的邮箱@example.com</a></p>
          <p><a href="https://github.com/wei1012578" target="_blank" rel="noopener">GitHub：github.com/wei1012578</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026 魏同学 · 用 HTML + CSS 制作</footer>

  <!-- ==================== 页面切换 JS ==================== -->
  <script>
    // 显示名字为 name 的页面
    function showPage(name) {
      // 1. 先隐藏所有页面
      document.querySelectorAll('.page').forEach(function (p) {
        p.classList.remove('active');
      });
      // 2. 显示目标页面
      document.getElementById('page-' + name).classList.add('active');
      // 3. 导航高亮同步
      document.querySelectorAll('nav a').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + name);
      });
      // 4. 回到页面顶部
      window.scrollTo(0, 0);
    }
    // 地址栏 # 变化时切页（支持浏览器后退键）
    window.addEventListener('hashchange', function () {
      var name = location.hash.slice(1) || 'home';
      showPage(name);
    });
    // 页面刚打开时显示默认页
    showPage(location.hash.slice(1) || 'home');
  </script>
</body>
</html>
